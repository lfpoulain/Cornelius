name: Verify
# push limité aux branches longues : une PR interne ne lance plus chaque vérification deux fois.
on:
  push:
    branches: [main, beta]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  perception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r perception/requirements.txt shellcheck-py==0.11.0.1
      - run: python -m unittest discover -s tests/python -p "test_*.py" -v
      - run: shellcheck -x scripts/*.sh
